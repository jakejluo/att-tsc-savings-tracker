name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t savings-tracker:ci .
      - name: Smoke test image
        run: |
          docker run -d --name app -p 3001:3001 -e JWT_SECRET=ci-only savings-tracker:ci
          for i in $(seq 1 20); do curl -fs localhost:3001/api/health && exit 0; sleep 1; done
          docker logs app; exit 1
